# Isolated workstation development only; --dev supplies devkey/secret.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # Auto-select the existing private container interface. Firefox blocks loopback
  # ICE candidates by default. The Linux host routes to this Docker bridge IP.
  # Keep use_external_ip false and all Compose host bindings on 127.0.0.1.
logging:
  level: info
